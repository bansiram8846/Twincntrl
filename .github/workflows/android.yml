name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          mkdir -p android/app/src/main/res/values
          cat << 'XML' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0f766e</color>
              <color name="colorPrimaryDark">#115e59</color>
              <color name="colorAccent">#14b8a6</color>
              <color name="splashscreen_background">#0f766e</color>
          </resources>
          XML
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Deterministic Keystore
        run: |
          mkdir -p android/app
          if [ ! -s android/app/debug.keystore ]; then
            echo "Restoring permanent signing keystore..."
            echo "" | base64 -d > android/app/debug.keystore
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twin-control.apk
          path: android/app/build/outputs/apk/debug/twin-cntrl.apk
